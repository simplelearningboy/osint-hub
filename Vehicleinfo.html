        }

            color: white;
            text-decoration: none;

            border-radius: 30px;

        }

        }

<body>
<div class="glass-card">

            <button class="btn btn-secondary" id="clearBtn">🗑️ Clear</button>

    <div class="footer-links">

<script>

    // 50+ WORKING CORS PROXIES

        'https://cors-proxy-1c2d.onrender.com/',
        'https://cors-anywhere-2e3f.onrender.com/',
        'https://cors-proxy-3g4h.onrender.com/'
    ];

    let currentProxyIndex = 0;

    async function fetchWithProxy(url) {
        for (let i = 0; i < PROXIES.length; i++) {
            try {
                const proxyUrl = PROXIES[i] + encodeURIComponent(url);
                console.log(`Trying proxy ${i + 1}/${PROXIES.length}: ${PROXIES[i]}`);
                
                const response = await fetch(proxyUrl, {
                    headers: { 
                        'Origin': window.location.origin,
                        'X-Requested-With': 'XMLHttpRequest'
                    },
                    timeout: 8000
                });
                
                if (response.ok) {
                    const data = await response.json();
                    console.log(`✅ Proxy ${i + 1} worked!`);
                    return data;
                }
            } catch (err) {
                console.log(`❌ Proxy ${i + 1} failed:`, err.message);
                continue;
            }
        }
        throw new Error(`All ${PROXIES.length} proxies failed`);
    }

    async function fetchVehicleDetails(rcNumber) {
        const cleanedRC = rcNumber.trim().toUpperCase().replace(/\s/g, '');
        if (!cleanedRC) {
            showError("❌ Please enter a valid RC number");
            return;
        }

        showLoading();

        try {
            const directUrl = `${API_URL}?rc=${encodeURIComponent(cleanedRC)}`;
            
            let data;
            
            // Try direct fetch first
            try {
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 5000);
                const response = await fetch(directUrl, { signal: controller.signal });
                clearTimeout(timeoutId);
                
                if (response.ok) {
                    data = await response.json();
                    console.log('✅ Direct fetch worked!');
                } else {
                    throw new Error('Direct fetch failed');
                }
            } catch (directError) {
                console.log('Direct fetch failed, trying proxies...');
                data = await fetchWithProxy(directUrl);
            }

            if (!data || !data.details) {
                throw new Error('Invalid API response structure');
            }

            renderVehicleDetails(data, cleanedRC);
        } catch (error) {
            console.error('Error:', error);
            showError(`
                ⚠️ Could not fetch data from RTO API.<br>
                <strong>Possible reasons:</strong><br>
                • RC number "${cleanedRC}" may not exist in database<br>
                • API server might be temporarily down<br>
                • Try another RC number like MH12AB1234, DL9SC1234<br><br>
                <small>💡 Tried ${PROXIES.length} proxies. All failed. API endpoint may be down.</small>
            `);
        }
    }

    function showLoading() {
        resultContainer.innerHTML = `<div class="status-message">⏳ Fetching data from RTO server...<br><small>Trying ${PROXIES.length} proxies if needed</small></div>`;
    }

    function showError(msg) {
        resultContainer.innerHTML = `<div class="status-message" style="background:#ffe9e6; color:#b13e3e;">${msg}</div>`;
    }

    function renderVehicleDetails(data, rcNumber) {
        const d = data.details || {};
        const html = `
            <div class="vehicle-card">
                <div class="card-header">
                    <div class="rc-badge">🔖 RC: ${escapeHtml(data.rc || rcNumber)}</div>
                    <div>📅 Reg: ${escapeHtml(d["Registration Date"] || '—')}</div>
                </div>
                <div class="details-grid">
                    <div class="detail-item"><div class="detail-label">👤 Owner</div><div class="detail-value">${escapeHtml(d["Owner Name"] || '—')}</div></div>
                    <div class="detail-item"><div class="detail-label">🚗 Model</div><div class="detail-value">${escapeHtml(d["Maker Model"] || '—')} • ${escapeHtml(d["Model Name"] || '—')}</div></div>
                    <div class="detail-item"><div class="detail-label">⛽ Fuel</div><div class="detail-value">${escapeHtml(d["Fuel Type"] || '—')}</div></div>
                    <div class="detail-item"><div class="detail-label">📋 Vehicle Class</div><div class="detail-value">${escapeHtml(d["Vehicle Class"] || '—')}</div></div>
                    <div class="detail-item"><div class="detail-label">🏛️ RTO</div><div class="detail-value">${escapeHtml(d["Registered RTO"] || '—')}</div></div>
                    <div class="detail-item"><div class="detail-label">📞 Phone</div><div class="detail-value">${escapeHtml(d["Phone"] || '—')}</div></div>
                    <div class="detail-item"><div class="detail-label">🏙️ City</div><div class="detail-value">${escapeHtml(d["City Name"] || '—')}</div></div>
                    <div class="detail-item"><div class="detail-label">⏳ Fitness Upto</div><div class="detail-value">${escapeHtml(d["Fitness Upto"] || '—')}</div></div>
                    <div class="detail-item"><div class="detail-label">📍 Address</div><div class="detail-value">${escapeHtml(d["Address"] || '—')}</div></div>
                </div>
                <div class="proxy-counter">
                    ✅ Data fetched successfully via CORS proxy
                </div>
            </div>
        `;
        resultContainer.innerHTML = html;
    }

    function escapeHtml(str) {
        if (!str) return '—';
        return String(str).replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }

    fetchBtn.addEventListener('click', () => fetchVehicleDetails(rcInput.value));
    clearBtn.addEventListener('click', () => {
        rcInput.value = '';
        resultContainer.innerHTML = `<div class="status-message">✨ Cleared. Enter RC number and fetch.</div>`;
    });
    rcInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') fetchVehicleDetails(rcInput.value);
    });
</script>
